[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-failure-evals"
version = "0.1.0"
description = "Evaluation harness for false-success claims in tool-using scientific AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ernest Boakye Danquah" }
]
dependencies = [
  "pydantic>=2.8",
  "pandas>=2.2",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10"
]

[project.scripts]
agent-evals = "agent_failure_evals.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_failure_evals"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
